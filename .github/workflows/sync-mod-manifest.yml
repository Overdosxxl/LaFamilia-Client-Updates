name: Sync Fabric 1.21.1 mod manifest
on:
  workflow_dispatch:
  push:
    paths:
      - 'updates/files/mods/**'
      - '.github/workflows/sync-mod-manifest.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mods and generate SHA256 manifest
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path("updates/files/mods")
          jars = sorted(root.glob("*.jar"), key=lambda p: p.name.casefold())
          manifest_path = Path("updates/manifest.json")
          old = json.loads(manifest_path.read_text(encoding="utf-8"))
          if old.get("minecraft") != "1.21.1" or old.get("loader") != "fabric":
              raise SystemExit("Manifest must target Fabric 1.21.1")
          files = []
          for path in jars:
              try:
                  with zipfile.ZipFile(path) as z:
                      if "fabric.mod.json" not in z.namelist():
                          raise ValueError("missing fabric.mod.json")
                      meta = json.loads(z.read("fabric.mod.json"))
                      if "fabric" not in str(meta.get("environment", "*")) and not isinstance(meta, dict):
                          raise ValueError("invalid Fabric metadata")
              except Exception as exc:
                  raise SystemExit(f"Invalid Fabric mod {path.name}: {exc}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({"path": "mods/" + path.name, "sha256": digest})
          old["files"] = files
          manifest_path.write_text(json.dumps(old, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Fabric mod count:", len(files))
          PY
      - name: Commit manifest update
        run: |
          if ! git diff --quiet -- updates/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates/manifest.json
            git commit -m "Sync Fabric 1.21.1 mod manifest"
            git push
          fi
